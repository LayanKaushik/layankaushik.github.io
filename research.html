<!DOCTYPE html>
<html lang="en">
<head>
  <script>
    (function() {
      var theme = localStorage.getItem('theme');
      if (theme) {
        document.documentElement.setAttribute('data-theme', theme);
      }
    })();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Layan Kaushik - Research in Economics and Computer Science">
  <title>Research | Layan Kaushik</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/research.css">
</head>
<body>
  <div id="header-placeholder"></div>
  <div class="container">
    <div id="sidebar-placeholder"></div>
    <main class="content">
      <section id="research">
        <h1>Research</h1>
        <div class="research-filters">
          <button class="filter-btn active" data-filter="all">All</button>
          <button class="filter-btn" data-filter="economics">Economics</button>
          <button class="filter-btn" data-filter="cs">Computer Science</button>
          <button class="filter-btn" data-filter="interdisciplinary">Interdisciplinary</button>
        </div>
        <div class="research-grid">
          <div class="research-card" data-category="economics">
            <div class="research-header">
              <h3>Research Paper Title</h3>
              <span class="research-date">2023</span>
            </div>
            <div class="research-authors">
              <span class="author">Layan Kaushik</span>
              <span class="co-authors">with Collaborator 1, Collaborator 2</span>
            </div>
            <p class="research-status">Working Paper</p>
            <p class="research-abstract">Abstract of the research paper goes here. This should be a brief summary of the research objectives, methodology, and key findings.</p>
            <div class="research-tags">
              <span class="tag">Economics</span>
              <span class="tag">Development</span>
            </div>
            <div class="research-links">
              <a href="#" class="research-link"><i class="fas fa-file-pdf"></i> PDF</a>
              <a href="#" class="research-link"><i class="fas fa-external-link-alt"></i> DOI</a>
            </div>
          </div>
          <!-- More research cards can be added here -->
        </div>
      </section>
    </main>
  </div>
  <footer>
    <p>© 2023 Layan Kaushik</p>
  </footer>
  <script>
    // Load header
    fetch('header.html')
      .then(response => response.text())
      .then(data => {
        document.getElementById('header-placeholder').innerHTML = data;
        // Update active link based on current page
        const currentPage = window.location.pathname.split('/').pop() || 'index.html';
        const links = document.querySelectorAll('.main-nav a');
        links.forEach(link => {
          if (link.getAttribute('href') === currentPage) {
            link.classList.add('active');
          } else {
            link.classList.remove('active');
          }
        });
        // Load and execute header.js
        const script = document.createElement('script');
        script.src = 'header.js';
        document.body.appendChild(script);
      });

    // Load sidebar
    fetch('sidebar.html')
      .then(response => response.text())
      .then(data => {
        document.getElementById('sidebar-placeholder').innerHTML = data;
    });

    // Research filtering functionality
    const filterButtons = document.querySelectorAll('.filter-btn');
    const researchCards = document.querySelectorAll('.research-card');

    filterButtons.forEach(button => {
      button.addEventListener('click', () => {
        // Remove active class from all buttons
        filterButtons.forEach(btn => btn.classList.remove('active'));
        // Add active class to clicked button
        button.classList.add('active');
        
        const filter = button.getAttribute('data-filter');
        
        researchCards.forEach(card => {
          if (filter === 'all' || card.getAttribute('data-category') === filter) {
            card.style.display = 'block';
          } else {
            card.style.display = 'none';
          }
        });
      });
    });
  </script>
</body>
</html>
