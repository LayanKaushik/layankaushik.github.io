<!DOCTYPE html>
<html lang="en">
<head>
  <script>
    (function() {
      var theme = localStorage.getItem('theme');
      if (theme) {
        document.documentElement.setAttribute('data-theme', theme);
      }
    })();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Layan Kaushik - Projects showcasing work in Economics and Computer Science">
  <title>Projects | Layan Kaushik</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/projects.css">
</head>
<body>
  <div id="header-placeholder"></div>
  <div class="container">
    <aside class="sidebar">
      <img src="images/profile_pic.jpg" alt="Layan Kaushik" class="profile-pic">
      <nav class="social-nav">
        <ul>
          <li><a href="https://github.com/LayanKaushik" target="_blank"><i class="fab fa-github"></i> GitHub</a></li>
          <li><a href="https://www.linkedin.com/in/layan-kaushik-9835a512a/" target="_blank"><i class="fab fa-linkedin-in"></i> LinkedIn</a></li>
        </ul>
      </nav>
    </aside>
    <main class="content">
      <section id="projects">
        <h1>Projects</h1>
        <div class="projects-grid">
          <div class="project-card">
            <div class="project-content">
              <h3>Project Title</h3>
              <p class="project-description">Brief description of the project and its goals. Focus on the academic or research aspects of the project.</p>
              <div class="project-tags">
                <span class="tag">Economics</span>
                <span class="tag">Data Analysis</span>
              </div>
              <div class="project-links">
                <a href="#" class="project-link"><i class="fab fa-github"></i> Code</a>
                <a href="#" class="project-link"><i class="fas fa-external-link-alt"></i> Demo</a>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>
  <footer>
    <p>© 2023 Layan Kaushik</p>
  </footer>
  <script>
    // Load header
    fetch('header.html')
      .then(response => response.text())
      .then(data => {
        document.getElementById('header-placeholder').innerHTML = data;
        // Update active link based on current page
        const currentPage = window.location.pathname.split('/').pop() || 'index.html';
        const links = document.querySelectorAll('.main-nav a');
        links.forEach(link => {
          if (link.getAttribute('href') === currentPage) {
            link.classList.add('active');
          } else {
            link.classList.remove('active');
          }
        });
        // Load and execute header.js
        const script = document.createElement('script');
        script.src = 'header.js';
        document.body.appendChild(script);
      });

    const themeToggle = document.getElementById('themeToggle');
    const icon = themeToggle.querySelector('i');
    
    const prefersDarkScheme = window.matchMedia('(prefers-color-scheme: dark)');
    const currentTheme = localStorage.getItem('theme') || 
                        (prefersDarkScheme.matches ? 'dark' : 'light');
    
    document.documentElement.setAttribute('data-theme', currentTheme);
    updateIcon(currentTheme);
    
    themeToggle.addEventListener('click', () => {
      const newTheme = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', newTheme);
      localStorage.setItem('theme', newTheme);
      updateIcon(newTheme);
    });
    
    function updateIcon(theme) {
      icon.className = theme === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
    }
  </script>
</body>
</html>
