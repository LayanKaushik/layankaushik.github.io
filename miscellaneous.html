<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Layan Kaushik - Miscellaneous interests and activities">
  <title>Miscellaneous | Layan Kaushik</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/miscellaneous.css">
</head>
<body>
  <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">
    <i class="fas fa-moon"></i>
  </button>
  <div id="header-placeholder"></div>
  <div class="container">
    <aside class="sidebar">
      <img src="images/profile_pic.jpg" alt="Layan Kaushik" class="profile-pic">
      <nav class="social-nav">
        <ul>
          <li><a href="https://github.com/LayanKaushik" target="_blank"><i class="fab fa-github"></i> GitHub</a></li>
          <li><a href="https://www.linkedin.com/in/layan-kaushik-9835a512a/" target="_blank"><i class="fab fa-linkedin-in"></i> LinkedIn</a></li>
        </ul>
      </nav>
    </aside>
    <main class="content">
      <section id="miscellaneous">
        <h1>Miscellaneous</h1>
        <div class="misc-grid">
          <div class="misc-section">
            <h2><i class="fas fa-book"></i> Reading</h2>
            <div class="misc-content">
              <div class="misc-card">
                <h3>Currently Reading</h3>
                <ul class="misc-list">
                  <li>Book Title 1</li>
                  <li>Book Title 2</li>
                </ul>
              </div>
              <div class="misc-card">
                <h3>Favorite Books</h3>
                <ul class="misc-list">
                  <li>Book Title 3</li>
                  <li>Book Title 4</li>
                </ul>
              </div>
            </div>
          </div>

          <div class="misc-section">
            <h2><i class="fas fa-award"></i> Awards & Honors</h2>
            <div class="misc-content">
              <div class="misc-card">
                <h3>Academic</h3>
                <ul class="misc-list">
                  <li>Award 1</li>
                  <li>Award 2</li>
                </ul>
              </div>
            </div>
          </div>

          <div class="misc-section">
            <h2><i class="fas fa-users"></i> Affiliations</h2>
            <div class="misc-content">
              <div class="misc-card">
                <h3>Current</h3>
                <ul class="misc-list">
                  <li>Affiliation 1</li>
                  <li>Affiliation 2</li>
                </ul>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>
  <footer>
    <p>© 2023 Layan Kaushik</p>
  </footer>
  <script>
    // Load header
    fetch('header.html')
      .then(response => response.text())
      .then(data => {
        document.getElementById('header-placeholder').innerHTML = data;
        // Update active link based on current page
        const currentPage = window.location.pathname.split('/').pop() || 'index.html';
        const links = document.querySelectorAll('.main-nav a');
        links.forEach(link => {
          if (link.getAttribute('href') === currentPage) {
            link.classList.add('active');
          } else {
            link.classList.remove('active');
          }
        });
      });

    const themeToggle = document.getElementById('themeToggle');
    const icon = themeToggle.querySelector('i');
    
    const prefersDarkScheme = window.matchMedia('(prefers-color-scheme: dark)');
    const currentTheme = localStorage.getItem('theme') || 
                        (prefersDarkScheme.matches ? 'dark' : 'light');
    
    document.documentElement.setAttribute('data-theme', currentTheme);
    updateIcon(currentTheme);
    
    themeToggle.addEventListener('click', () => {
      const newTheme = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', newTheme);
      localStorage.setItem('theme', newTheme);
      updateIcon(newTheme);
    });
    
    function updateIcon(theme) {
      icon.className = theme === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
    }
  </script>
</body>
</html>
